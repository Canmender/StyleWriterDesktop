# 训练配置
model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  max_length: 2048

training:
  epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_ratio: 0.1
  lr_scheduler: "cosine"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

quantization:
  enabled: true
  bits: 4

output:
  dir: "./output"
  save_strategy: "epoch"

